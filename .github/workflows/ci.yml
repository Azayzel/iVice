name: Test & Capture UI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
  browser-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright pillow
      - run: python -m playwright install chromium --with-deps
      - run: python scripts/visual_snapshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-snapshot-artifacts
          path: docs/screenshots/*.png
          if-no-files-found: warn
