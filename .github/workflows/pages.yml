name: Pages — iVice coming soon
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -s docs/index.html
          test -s docs/preview.html
          test -s docs/wiki.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: docs
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # The artifact service can finalize uploads before the Actions REST API
      # indexes them. Wait for the same named artifact deploy-pages will query.
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages&per_page=100"
          for attempt in {1..18}; do
            if count=$(gh api "$endpoint" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [[ "$count" == "1" ]]; then
                echo "Pages artifact is visible to the API."
                exit 0
              fi
              if (( count > 1 )); then
                echo "::error::Multiple active github-pages artifacts found. Start a fresh workflow run."
                exit 1
              fi
            fi
            echo "Waiting for artifact metadata (attempt $attempt/18)"
            if (( attempt < 18 )); then sleep 5; fi
          done
          echo "::error::Pages artifact did not become visible. Re-run the failed deploy job."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
