oute for apples-to-apples comparisons.","region":"General","sourceType":"community","sourceUrl":"https://www.theguardian.com/games/2026/nov/19/tips-for-playing-grand-theft-auto-vi","sourceLabel":"The Guardian — 15 playing tips","sources":[{"label":"The Guardian — 15 playing tips","url":"https://www.theguardian.com/games/2026/nov/19/tips-for-playing-grand-theft-auto-vi"},{"label":"GTA Base — Best cars database","url":"https://www.gtabase.com/gta-6/vehicles/"}],"spoiler":false,"tags":["cars","getaway","best","handling"],"steps":[{"id":"t1","label":"Choose car with enough seats"},{"id":"t2","label":"Practice braking and cornering"},{"id":"t3","label":"Test police-escape route"},{"id":"t4","label":"Store a backup outside the mission area"}],"stage":"Any time","vehicleClass":"Car","confidence":"reported","recommendation":"PRACTICAL PICK"},{"id":"vehicles-aircraft","title":"Planes & helicopters: buyer’s guide","category":"Vehicles","summary":"Compare aircraft by access, landing room, flight stability and speed.","body":"Current public aircraft lists are still being tested. Rather than declare an unverified fastest jet, compare available aircraft for the job: fixed-wing for long routes, helicopter for flexible landings, and utility aircraft for exploration.","region":"General","sourceType":"community","sourceUrl":"https://www.gtabase.com/gta-6/vehicles/best-planes/","sourceLabel":"GTA Base — Plane comparisons","sources":[{"label":"GTA Base — Plane comparisons","url":"https://www.gtabase.com/gta-6/vehicles/best-planes/"}],"spoiler":false,"tags":["airplanes","planes","helicopter","jets","aircraft"],"steps":[{"id":"t1","label":"Log aircraft you have access to"},{"id":"t2","label":"Record acquisition location"},{"id":"t3","label":"Compare takeoff distance and landing options"},{"id":"t4","label":"Add a personal speed and handling note"}],"stage":"When unlocked","vehicleClass":"Aircraft","confidence":"reported","recommendation":"AIRCRAFT GUIDE"},{"id":"vehicles-speedboats","title":"Speedboats: coastal travel picks","category":"Vehicles","summary":"Choose watercraft based on coastal runs, handling and passenger needs.","body":"Boat rankings are still being compiled and published data may differ across sources. Compare fast open-water craft, nimble inflatables and airboats for wetlands. No unsourced top-speed figure is presented as a verified GTA VI measurement.","region":"General","sourceType":"community","sourceUrl":"https://www.gtabase.com/gta-6/vehicles/best-boats/","sourceLabel":"GTA Base — Boat comparisons","sources":[{"label":"GTA Base — Boat comparisons","url":"https://www.gtabase.com/gta-6/vehicles/best-boats/"}],"spoiler":false,"tags":["boats","speedboats","watercraft","coast"],"steps":[{"id":"t1","label":"Identify a fast open-water boat"},{"id":"t2","label":"Test turning and braking in a narrow channel"},{"id":"t3","label":"Compare passenger capacity"},{"id":"t4","label":"Record the best boat for your route"}],"stage":"When unlocked","vehicleClass":"Boat","confidence":"reported","recommendation":"WATERCRAFT GUIDE"},{"id":"vehicles-offroad","title":"Off-road and swamp vehicles","category":"Vehicles","summary":"Prioritize suspension, terrain control and access in rural Leonida.","body":"A fast highway car may perform poorly on unpaved trails and wet terrain. Compare practical utility vehicles and specialized water/airboats by the terrain you actually travel.","region":"General","sourceType":"community","sourceUrl":"https://www.gtabase.com/gta-6/vehicles/","sourceLabel":"GTA Base — Best cars database","sources":[{"label":"GTA Base — Best cars database","url":"https://www.gtabase.com/gta-6/vehicles/"},{"label":"GTA Base — Boat comparisons","url":"https://www.gtabase.com/gta-6/vehicles/best-boats/"}],"spoiler":false,"tags":["cars","offroad","swamp","terrain","vehicles"],"steps":[{"id":"t1","label":"Pick a test route in an off-road area"},{"id":"t2","label":"Try an off-road-oriented vehicle"},{"id":"t3","label":"Compare traction and st const saved=()=>{try{return JSON.parse(localStorage.getItem('ivice-preview-progress')||'{}')}catch{return {}}};const progress=saved();let tab='Home',category='All',query='',current=null,showSpoilers=false;
const cats=['Money','Story','Vehicles','Places','People','Play Guides','Collections'];const symbols={Money:'$',Story:'↗',Vehicles:'⌁',Places:'◇',People:'♧','Play Guides':'♟',Collections:'✓'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>entries.find(x=>x.id===id);const visible=()=>entries.filter(e=>showSpoilers||!e.spoiler);
const panel=e=>`<button class="panel" data-entry="${esc(e.id)}"><div class="symbol">${symbols[e.category]||'◇'}</div><div><b>${esc(e.title)}</b><small>${esc(e.category.toUpperCase())} · ${esc(e.confidence==='reported'?'SOURCE-LINKED':e.sourceType==='official'?'OFFICIAL':'TRACKER')}</small><p>${esc(e.summary)}</p></div><span style="color:#8984a3">›</span></button>`;
function setTab(next){tab=next;current=null;render()}
function selectCategory(cat){tab='Library';category=cat;query='';current=null;render()}
function openEntry(id){current=byId(id);render()}
function saveCheck(id,step){const k=`${id}:${step}`;progress[k]=!progress[k];try{localStorage.setItem('ivice-preview-progress',JSON.stringify(progress))}catch{}render()}
function render(){const el=document.getElementById('content');const nav=document.getElementById('nav');nav.innerHTML=['Home','Library','Track','Notes'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}"><span>${{Home:'⌂',Library:'▤',Track:'☑',Notes:'✎'}[t]}</span>${t.toUpperCase()}</button>`).join('');if(current){const e=current;el.innerHTML=`<button class="back" data-back>← BACK TO LIBRARY</button><div class="guidehead"><div class="icon">${symbols[e.category]||'◇'}</div><span class="label">${esc(e.category.toUpperCase())} / ${esc(e.stage||'FIELD INTEL')}</span><h1>${esc(e.title)}</h1><p>${esc(e.summary)}</p></div>${e.recommendation?`<div style="color:var(--gold);font-weight:900;letter-spacing:1px;font-size:11px">★ ${esc(e.recommendation)}</div>`:''}<p><span class="tag">${esc(e.confidence==='reported'?'SOURCE-LINKED / REPORTED':e.sourceType==='official'?'OFFICIAL SOURCE':'TRACKER TEMPLATE')}</span>${e.spoiler?'<span class="tag">SPOILERS</span>':''}</p><h2 class="section">FIELD INTEL</h2><p class="bodytext">${esc(e.body)}</p><h2 class="section">Your checklist</h2><ul class="checks">${e.steps.map(st=>`<li><label><input type="checkbox" data-check="${esc(e.id)}::${esc(st.id)}" ${progress[`${e.id}:${st.id}`]?'checked':''}><span>${esc(st.label)}</span></label></li>`).join('')}</ul><h2 class="section">Sources & attribution</h2>${(e.sources||[]).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noreferrer noopener">↗ ${esc(s.label)}</a>`).join('')||'<p class="muted">Private tracker template</p>'}`}
else if(tab==='Home'){el.innerHTML=`<div class="hero"><div class="kicker">YOUR PASS TO LEONIDA</div><h1>PLAY SMARTER.<br>EXPLORE <span style="color:var(--aqua)">EVERYTHING.</span></h1><p>Your spoiler-aware GTA VI pocket guide. Built for the second screen.</p><button class="cta" data-category="All">OPEN THE LIBRARY →</button></div><div class="section">Quick guides</div><div class="tiles">${[['Money','MAKE MONEY','Routes & rewards'],['Story','STORY PATH','Chapters & missables'],['Vehicles','BEST RIDES','Cars, planes & boats'],['Collections','TRACK IT','Secrets & checklists']].map(([c,t,s])=>`<button class="tile" data-category="${c}"><div class="icon">${symbols[c]}</div><b>${t}</b><small>${s}</small></button>`).join('')}</div><div class="stats"><div class="stat"><b>${entries.length}</b><small>FIELD FILES</small></div><div class="stat"><b>7</b><small>CATEGORIES</small></div><div class="stat"><b>OFF</b><small>ONLINE REQUIRED</small></div></div><h2 class="section">Featured field notes</h2>${['money-stolen-cars','story-spoiler-safe-route','vehicles-aircraft'].map(id=>panel(byId(id))).join('')}<p class="note">Unofficial community guide. Factual claims have linked sources.</p>`}
else if(tab==='Library'){const found=visible().filter(x=>(category==='All'||x.category===category)&&(`${x.title} ${x.summary} ${x.tags.join(' ')}`).toLowerCase().includes(query.toLowerCase()));el.innerHTML=`<h1>THE LIBRARY<span style="color:var(--pink)">.</span></h1><p class="muted">Search money routes, characters, chapters and vehicles.</p><input class="search" id="search" type="search" placeholder="Try cars, Brian Heder, Chapter 2…" value="${esc(query)}" aria-label="Search guides"><div class="chips">${['All',...cats].map(x=>`<button class="chip ${x===category?'active':''}" data-category="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="spoilers">SPOILER CONTENT <label><input type="checkbox" id="spoilers" ${showSpoilers?'checked':''}> ${showSpoilers?'Visible':'Hidden'}</label></div><p class="small" style="margin-top:19px">${found.length} REFERENCE PAGES</p>${found.map(panel).join('')||'<p class="muted">No matching entries.</p>'}`}
else if(tab==='Track'){const all=visible().flatMap(e=>e.steps.map(x=>[e,x]));const count=all.filter(([e,s])=>progress[`${e.id}:${s.id}`]).length;const percent=all.length?Math.round(count*100/all.length):0;el.innerHTML=`<h1>YOUR PROGRESS<span style="color:var(--aqua)">.</span></h1><p class="muted">Separate playthrough profiles are available in the native app.</p><div class="trackbox"><div class="label">DEMO PLAYTHROUGH</div><h1 style="font-size:43px;margin:6px 0">${percent}%</h1><p>${count} / ${all.length} tasks</p><div class="progress"><div style="width:${percent}%"></div></div></div><h2 class="section">Recommended checklists</h2>${visible().filter(x=>['Story','Money','Vehicles'].includes(x.category)).slice(0,8).map(panel).join('')}`}
else{el.innerHTML=`<h1>FIELD NOTES<span style="color:var(--pink)">.</span></h1><p class="muted">The native app stores private notes per playthrough in on-device SQLite. Notes are never uploaded to the preview site.</p><div class="panel"><div class="symbol">✎</div><div><b>Your discoveries stay yours</b><p>Open the native app to create private field notes with offline persistence.</p></div></div>`}
nav.querySelectorAll('button[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));el.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>selectCategory(b.dataset.category));el.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));el.querySelector('[data-back]')?.addEventListener('click',()=>{current=null;tab='Library';render()});el.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{const [id,step]=b.dataset.check.split('::');saveCheck(id,step)});el.querySelector('#search')?.addEventListener('input',ev=>{const pos=ev.target.selectionStart;query=ev.target.value;render();const n=document.getElementById('search');n?.focus();n?.setSelectionRange(pos,pos)});el.querySelector('#spoilers')?.addEventListener('change',ev=>{showSpoilers=ev.target.checked;render()});}
render();
</script></body></html>
